name: Zarvis canary
# Hourly production probe of the zero-cost starter questions (see docs/zarvis.md, Operations).
# Requires the repository secret ZARVIS_CRON_SECRET, equal to the Railway service's CRON_SECRET.
# The endpoint answers 503 when a check fails, which fails this job and shows in the Actions history;
# the application itself posts to ZARVIS_ALERT_WEBHOOK_URL when configured.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the starter questions
        env:
          ZARVIS_CRON_SECRET: ${{ secrets.ZARVIS_CRON_SECRET }}
        run: |
          test -n "$ZARVIS_CRON_SECRET" || { echo "ZARVIS_CRON_SECRET secret is not set"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $ZARVIS_CRON_SECRET" \
            https://openzcash.org/api/zarvis/canary
